[package]
name = "mc-protocol"
version = "0.1.0"
edition = "2024"

[dependencies]
regex = "1.12.2"
json = "0.12.4"
tokio = { version = "1.48.0", features = ["full"], default-features = false }
futures = "0.3.31"
rand = "0.9.2"
crab_nbt = "0.2.11"
num-bigint = "0.4.6"
sha1 = "0.11.0"
rsa = "0.9.10"
cfb8 = "0.9.0"
aes = "0.9.0"

[profile.dev]
opt-level = 0
debug = true
incremental = true
overflow-checks = true

[profile.release]
opt-level = 3
debug = false
lto = true
codegen-units = 1
panic = "abort"
split-debuginfo = "unpacked"
